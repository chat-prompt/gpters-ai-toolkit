name: Release

on:
  push:
    branches: [main]
    paths:
      - 'apps/opencode-plugin/**'
  workflow_dispatch:

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: pnpm install

      - name: Build
        run: pnpm build --filter=@gpters-internal/opencode

      - name: Configure Verdaccio registry
        run: |
          echo "@gpters-internal:registry=https://verdaccio.gpters.org" >> .npmrc
          echo "//verdaccio.gpters.org/:_authToken=\${VERDACCIO_TOKEN}" >> .npmrc

      - name: Publish
        run: pnpm publish --filter=@gpters-internal/opencode --no-git-checks
        env:
          VERDACCIO_TOKEN: ${{ secrets.VERDACCIO_TOKEN }}
