name: Release

on:
  push:
    branches: [main]
    paths:
      - 'apps/opencode-plugin/**'
  workflow_dispatch:

# 이 워크플로는 저장소를 읽기만 한다 (저장소 기본 토큰 권한이 넓어져도 따라가지 않게 명시)
permissions:
  contents: read

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.12.2

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: pnpm install

      - name: Build
        run: pnpm build --filter=@gpters-internal/opencode

      - name: Configure Verdaccio registry
        run: |
          echo "@gpters-internal:registry=https://verdaccio.gpters.org" >> .npmrc
          echo "//verdaccio.gpters.org/:_authToken=\${VERDACCIO_TOKEN}" >> .npmrc

      - name: Publish
        run: pnpm publish --filter=@gpters-internal/opencode --no-git-checks
        env:
          VERDACCIO_TOKEN: ${{ secrets.VERDACCIO_TOKEN }}
