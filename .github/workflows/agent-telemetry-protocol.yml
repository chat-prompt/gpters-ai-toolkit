name: Agent telemetry protocol
on:
  pull_request:
    paths:
      - 'infra/agent-telemetry/**'
      - '.github/workflows/agent-telemetry-protocol.yml'
  push:
    branches: [main]
    paths:
      - 'infra/agent-telemetry/**'
      - '.github/workflows/agent-telemetry-protocol.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test infra/agent-telemetry/verify-installation.test.mjs
