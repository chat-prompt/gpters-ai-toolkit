name: Agent telemetry protocol
on:
  pull_request:
    paths:
      - 'infra/agent-telemetry/**'
      - 'infra/agent-observability/**'
      - 'apps/aitk-cli/**'
      - 'packages/lib/src/features/ax/agent-*.ts'
      - 'packages/lib/src/features/ax/observation-trends.ts'
      - 'apps/web/components/ax/panels/Agent*.tsx'
      - '.github/workflows/agent-telemetry-protocol.yml'
  push:
    branches: [main]
    paths:
      - 'infra/agent-telemetry/**'
      - 'infra/agent-observability/**'
      - 'apps/aitk-cli/**'
      - 'packages/lib/src/features/ax/agent-*.ts'
      - 'packages/lib/src/features/ax/observation-trends.ts'
      - 'apps/web/components/ax/panels/Agent*.tsx'
      - '.github/workflows/agent-telemetry-protocol.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - run: node --test infra/agent-telemetry/verify-installation.test.mjs

  collector:
    name: Collector (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: pnpm install --frozen-lockfile
      - run: node --test infra/agent-observability/*.test.mjs
      - run: pnpm --filter @gpters/aitk test
      - run: pnpm --filter @gpters/aitk typecheck
      - run: pnpm --filter @gpters/web exec vitest run tests/unit/ax-agent-activity-panel.test.ts tests/unit/ax-agent-activity-view.test.tsx tests/unit/ax-agent-task-events.test.ts tests/unit/ax-agent-task-timeline.test.tsx tests/unit/ax-agent-telemetry-contract.test.ts tests/unit/ax-agent-telemetry-route.test.ts tests/unit/ax-observation-trends.test.ts tests/unit/ax-observation-view.test.tsx tests/unit/ax-observation-route.test.ts
