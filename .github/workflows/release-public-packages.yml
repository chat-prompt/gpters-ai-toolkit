name: Release public packages

on:
  push:
    branches:
      - main
    paths:
      - apps/aitk-cli/package.json
  workflow_dispatch:
    inputs:
      package:
        description: Package to publish
        required: true
        default: aitk
        type: choice
        options:
          - aitk
          - codex-plugin
          - all

permissions:
  contents: read
  id-token: write

concurrency:
  group: release-public-packages
  cancel-in-progress: false

jobs:
  publish:
    name: Publish ${{ matrix.package }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(github.event_name == 'push' && '[{"package":"@gpters/aitk","directory":"apps/aitk-cli"}]' || inputs.package == 'all' && '[{"package":"@gpters/aitk","directory":"apps/aitk-cli"},{"package":"@gpters/codex-plugin","directory":"apps/codex-plugin"}]' || inputs.package == 'aitk' && '[{"package":"@gpters/aitk","directory":"apps/aitk-cli"}]' || '[{"package":"@gpters/codex-plugin","directory":"apps/codex-plugin"}]') }}

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 10.12.2

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm --filter "${{ matrix.package }}" test

      - name: Typecheck
        run: pnpm --filter "${{ matrix.package }}" typecheck

      - name: Build
        run: pnpm --filter "${{ matrix.package }}" build

      - name: Read package metadata
        id: package
        env:
          EXPECTED_PACKAGE_NAME: ${{ matrix.package }}
        run: |
          PACKAGE_NAME="$(node -p "require('./${{ matrix.directory }}/package.json').name")"
          PACKAGE_VERSION="$(node -p "require('./${{ matrix.directory }}/package.json').version")"
          if [ "$PACKAGE_NAME" != "$EXPECTED_PACKAGE_NAME" ]; then
            echo "Package name mismatch: expected $EXPECTED_PACKAGE_NAME, got $PACKAGE_NAME" >&2
            exit 1
          fi
          echo "version=$PACKAGE_VERSION" >> "$GITHUB_OUTPUT"

      - name: Check registry
        id: registry
        env:
          PACKAGE_NAME: ${{ matrix.package }}
          PACKAGE_VERSION: ${{ steps.package.outputs.version }}
        run: |
          if REGISTRY_RESULT="$(npm view "$PACKAGE_NAME@$PACKAGE_VERSION" version 2>&1)"; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "$PACKAGE_NAME@$PACKAGE_VERSION already exists; skipping."
          elif echo "$REGISTRY_RESULT" | grep -qE 'E404|404 Not Found'; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "$REGISTRY_RESULT" >&2
            exit 1
          fi

      - name: Publish
        if: steps.registry.outputs.publish == 'true'
        working-directory: ${{ matrix.directory }}
        run: npm publish --access public
