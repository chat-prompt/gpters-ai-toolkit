name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 모든 작업은 저장소를 읽기만 한다. 저장소 기본 토큰 권한이 넓어져도 CI 가 따라가지 않게 명시한다.
permissions:
  contents: read

env:
  DATABASE_URL: ${{ secrets.DATABASE_URL }}
  GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
  GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
  AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
  AUTH_URL: ${{ secrets.AUTH_URL }}
  NEXT_PUBLIC_BASE_URL: https://ai-toolkit.gpters.org

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

  test-unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    env:
      # 단위 테스트는 외부 비밀값이 필요 없다. 워크플로 전역 env 의 비밀값을 이 작업에서는 모두 지운다
      # — PR 브랜치의 테스트·스크립트 코드가 실행되는 작업이라 공유 DB·OAuth·세션 서명 키를 쥐여 주지 않는다.
      # (turbo strict env 모드라 원래도 테스트 프로세스에는 전달되지 않지만, 설치 단계·turbo 상위 프로세스에는 남는다)
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:1/ci_unit_tests_no_db
      GOOGLE_CLIENT_ID: ''
      GOOGLE_CLIENT_SECRET: ''
      AUTH_SECRET: ''
      AUTH_URL: ''
      # 격리 PostgreSQL 테스트(*.postgres.test.ts)는 RUN_ISOLATED_*_TESTS=true 일 때만 돌고 여기서는 skip 된다.
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run unit tests
        run: pnpm test

  test-api:
    name: API Tests
    # API suite mutates catalog data. Run only when the repository has an isolated
    # test DB configured and an owner explicitly enables the workflow variable.
    if: ${{ vars.RUN_ISOLATED_API_TESTS == 'true' }}
    runs-on: ubuntu-latest
    needs: build
    env:
      DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
      TEST_DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
      TEST_API_URL: http://127.0.0.1:3100
      CONFIRM_ISOLATED_API_TESTS: run-mutating-api-tests
      RUN_DB_TEST_CLEANUP: 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Start isolated API server
        run: pnpm --filter @gpters/web exec next dev -p 3100 > /tmp/aitk-api-test-server.log 2>&1 &

      - name: Wait for isolated API server
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3100/auth/signin >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/aitk-api-test-server.log
          exit 1

      - name: Run API tests
        run: pnpm test:api

  test-e2e:
    name: E2E Tests
    # E2E also mutates catalog data. Never inherit the shared DATABASE_URL.
    if: ${{ vars.RUN_ISOLATED_API_TESTS == 'true' }}
    env:
      DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
      TEST_DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm --filter @gpters/web exec playwright install chromium --with-deps

      - name: Build application
        run: pnpm build

      - name: Run E2E tests
        run: |
          test -n "$TEST_DATABASE_URL" || { echo 'An isolated TEST_DATABASE_URL is required'; exit 1; }
          pnpm --filter @gpters/web start &
          sleep 10
          PLAYWRIGHT_TEST_BASE_URL=http://localhost:3000 pnpm test:e2e

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
