name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 모든 작업은 저장소를 읽기만 한다. 저장소 기본 토큰 권한이 넓어져도 CI 가 따라가지 않게 명시한다.
permissions:
  contents: read

# 비밀값은 실제로 필요한 작업(API·E2E)에만 둔다. lint·build·test-unit 은 비밀값 없이 통과한다
# — 2026-09-21 에 환경을 비우고(env -i) build·lint 를 캐시 없이 돌려 확인했다.
env:
  NEXT_PUBLIC_BASE_URL: https://ai-toolkit.gpters.org

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

  test-unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    env:
      # 단위 테스트는 DB 를 목으로 대신한다. 실수로 실제 DB 를 부르는 테스트가 생기면
      # 공유 DB 가 아니라 연결 실패로 드러나도록 닿을 수 없는 주소를 준다.
      # 격리 PostgreSQL 테스트(*.postgres.test.ts)는 RUN_ISOLATED_*_TESTS=true 일 때만 돌고 여기서는 skip 된다.
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:1/ci_unit_tests_no_db
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run unit tests
        run: pnpm test

  test-api:
    name: API Tests
    # API suite mutates catalog data. Run only when the repository has an isolated
    # test DB configured and an owner explicitly enables the workflow variable.
    if: ${{ vars.RUN_ISOLATED_API_TESTS == 'true' }}
    runs-on: ubuntu-latest
    needs: build
    env:
      DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
      TEST_DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
      AUTH_URL: ${{ secrets.AUTH_URL }}
      TEST_API_URL: http://127.0.0.1:3100
      CONFIRM_ISOLATED_API_TESTS: run-mutating-api-tests
      RUN_DB_TEST_CLEANUP: 'true'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Start isolated API server
        run: pnpm --filter @gpters/web exec next dev -p 3100 > /tmp/aitk-api-test-server.log 2>&1 &

      - name: Wait for isolated API server
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3100/auth/signin >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/aitk-api-test-server.log
          exit 1

      - name: Run API tests
        run: pnpm test:api

  test-e2e:
    name: E2E Tests
    # E2E also mutates catalog data. Never inherit the shared DATABASE_URL.
    if: ${{ vars.RUN_ISOLATED_API_TESTS == 'true' }}
    env:
      DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
      TEST_DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
      AUTH_URL: ${{ secrets.AUTH_URL }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm --filter @gpters/web exec playwright install chromium --with-deps

      - name: Build application
        run: pnpm build

      - name: Run E2E tests
        run: |
          test -n "$TEST_DATABASE_URL" || { echo 'An isolated TEST_DATABASE_URL is required'; exit 1; }
          pnpm --filter @gpters/web start &
          sleep 10
          PLAYWRIGHT_TEST_BASE_URL=http://localhost:3000 pnpm test:e2e

      - name: Upload Playwright report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
